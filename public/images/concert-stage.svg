<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="40%" stop-color="#10233b"/>
      <stop offset="70%" stop-color="#16385d"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#acdfff" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#2a7cb2" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#143457" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080e18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamL1" x1="20%" y1="0%" x2="45%" y2="70%">
      <stop offset="0%" stop-color="#acdfff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#acdfff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR1" x1="80%" y1="0%" x2="55%" y2="70%">
      <stop offset="0%" stop-color="#acdfff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#acdfff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamCenter" x1="50%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#73c5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#73c5fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurLight">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Stage Glow -->
  <ellipse cx="960" cy="580" rx="750" ry="420" fill="url(#stageGlow)"/>

  <!-- Light Beams from Truss -->
  <polygon points="350,0 420,0 720,700 620,700" fill="url(#beamL1)"/>
  <polygon points="200,0 280,0 550,750 430,750" fill="url(#beamL1)" opacity="0.6"/>
  <polygon points="1570,0 1500,0 1200,700 1300,700" fill="url(#beamR1)"/>
  <polygon points="1720,0 1640,0 1370,750 1490,750" fill="url(#beamR1)" opacity="0.6"/>
  <polygon points="910,0 1010,0 1150,720 770,720" fill="url(#beamCenter)"/>

  <!-- Floating particles / bokeh -->
  <circle cx="820" cy="480" r="14" fill="#acdfff" opacity="0.3" filter="url(#blurLight)"/>
  <circle cx="1100" cy="430" r="18" fill="#acdfff" opacity="0.25" filter="url(#blurLight)"/>
  <circle cx="960" cy="380" r="22" fill="#72c5fb" opacity="0.4" filter="url(#blurLight)"/>
  <circle cx="650" cy="520" r="8" fill="#acdfff" opacity="0.2"/>
  <circle cx="1270" cy="500" r="10" fill="#acdfff" opacity="0.25"/>

  <!-- Stage Platform -->
  <polygon points="360,650 1560,650 1820,820 100,820" fill="#0c1624" opacity="0.95"/>
  <line x1="360" y1="650" x2="1560" y2="650" stroke="#acdfff" stroke-width="3" opacity="0.7"/>

  <!-- Stage Rigs & Speakers -->
  <rect x="250" y="440" width="80" height="230" fill="#070c14" rx="6"/>
  <rect x="1590" y="440" width="80" height="230" fill="#070c14" rx="6"/>
  
  <!-- Crowd Silhouette at the Bottom -->
  <path d="M0,1080 L0,840 
           C40,830 70,860 110,835 C140,810 160,840 200,830 C230,820 250,790 280,810 
           C310,830 340,780 370,805 C400,830 430,800 460,815 C490,830 520,770 560,790 
           C600,810 630,760 670,785 C710,810 750,750 790,775 C830,800 870,740 910,765
           C950,790 990,750 1030,770 C1070,790 1110,760 1150,785 C1190,810 1230,770 1270,795
           C1310,820 1350,780 1390,805 C1430,830 1470,790 1510,815 C1550,840 1580,800 1620,825
           C1660,850 1700,820 1740,835 C1780,850 1820,820 1860,840 C1900,860 1920,830 1920,850
           L1920,1080 Z" fill="#04070c"/>

  <!-- Hands & Raised Arms Silhouette in Crowd -->
  <!-- Hand 1 -->
  <path d="M460,820 L455,730 C455,720 468,720 468,730 L470,770 L475,740 C475,730 487,730 487,740 L488,775 L492,750 C492,740 503,740 503,750 L498,825 Z" fill="#04070c"/>
  <!-- Hand 2 (Rock Sign) -->
  <path d="M780,780 L772,700 C772,690 784,690 784,700 L786,735 L795,735 L802,700 C802,690 814,690 814,700 L806,785 Z" fill="#04070c"/>
  <!-- Hand 3 -->
  <path d="M1120,790 L1125,710 C1125,700 1138,700 1138,710 L1140,750 L1145,725 C1145,715 1156,715 1156,725 L1154,795 Z" fill="#04070c"/>
  <!-- Hand 4 (Smartphone recording) -->
  <path d="M1380,810 L1385,730 L1415,730 L1415,780 L1420,815 Z" fill="#04070c"/>
  <rect x="1387" y="734" width="24" height="38" rx="2" fill="#acdfff" opacity="0.7"/>

  <!-- Subtle Vignette Bottom Overlay -->
  <rect y="700" width="1920" height="380" fill="url(#bgGrad)" opacity="0.35"/>
</svg>
